<div id="dayform" class="container">
    <div class="flex-container">
        <div class="flex-child">
            <p>Date: </p>
        </div>
        <div class="flex-child">
            <ion-datetime-button datetime="datetime"></ion-datetime-button>
            <ion-modal [keepContentsMounted]="true">
                <ng-template>
                    <ion-datetime id="datetime" (ionChange)="onDateSelected($event)" presentation="date"></ion-datetime>
                </ng-template>
            </ion-modal>
        </div>
    </div>
    <ion-button (click)="newAisle()">New Aisle</ion-button>
    <ul>
        @for (listedAisle of today.aisles; track $index) {
            <li>
                <app-aisle [aisle] = "listedAisle"/>
            </li>
        }
    </ul>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div>
            <label for=""></label>
        </div>
    </form>
</div>
