<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Current Day
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Days</ion-title>
    </ion-toolbar>
  </ion-header>
  @if(!selectDay){
    <div class="ion-text-center">
      <app-dayform [input] = "currentDay" ></app-dayform>
    </div>
  }@else{
    <ion-button (click)="SelectDay()" class="container">Select Day</ion-button>
  }
  

</ion-content>
