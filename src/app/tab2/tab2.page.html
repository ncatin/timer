<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      List Of Days
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 2</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-button (click)="newDay()" class="container">New Day</ion-button>
  <ul class="ul-container">
    @for (day of days | keyvalue; track day.key) {

      <li>
        
        <div> {{day.value.date}} </div>
        <div>
          <ion-button (click)="selectDay(day.value.id)">Select Day</ion-button>
        </div>
        
      </li>
    }
  </ul>
</ion-content>
